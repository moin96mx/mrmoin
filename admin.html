<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Dashboard | MR MOIN</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="brand.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">MR MOIN / OPERATIONS</p>
        <h1>Project inbox</h1>
        <p class="muted">Review new enquiries and live-room questions in one place.</p>
      </div>
      <button id="logoutBtn" class="button secondary" hidden>Sign out</button>
    </header>

    <section id="loginPanel" class="panel login-panel">
      <p class="eyebrow">SECURE ACCESS</p>
      <h2>Admin sign in</h2>
      <form id="loginForm" class="stack">
        <label>Email<input id="adminEmail" type="email" autocomplete="username" required></label>
        <label>Password<input id="adminPassword" type="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit">Sign in</button>
        <p id="loginStatus" class="status" role="status"></p>
      </form>
    </section>

    <section id="dashboardPanel" hidden>
      <div class="dashboard-grid">
        <article class="panel">
          <div class="panel-heading">
            <h2>Project enquiries</h2>
            <div class="panel-actions">
              <button id="toggleArchivedProjects" class="button small secondary" data-showing="false">Show archived</button>
              <button id="exportProjects" class="button small secondary">Export CSV</button>
              <button id="refreshProjects" class="button small secondary">Refresh</button>
            </div>
          </div>
          <div class="filter-row">
            <input id="searchProjects" type="text" placeholder="Search name, email, message...">
            <select id="filterStatusProjects">
              <option value="all">All statuses</option>
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="in_progress">In progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div id="projectList" class="record-list"><p class="muted">No project enquiries yet.</p></div>
          <button id="loadMoreProjects" class="button small secondary load-more" hidden>Load more</button>
        </article>
        <article class="panel">
          <div class="panel-heading">
            <h2>Live questions</h2>
            <div class="panel-actions">
              <button id="toggleArchivedQuestions" class="button small secondary" data-showing="false">Show archived</button>
              <button id="exportQuestions" class="button small secondary">Export CSV</button>
              <button id="refreshQuestions" class="button small secondary">Refresh</button>
            </div>
          </div>
          <div class="filter-row">
            <input id="searchQuestions" type="text" placeholder="Search name, email, question...">
            <select id="filterStatusQuestions">
              <option value="all">All statuses</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
            </select>
          </div>
          <div id="questionList" class="record-list"><p class="muted">No live questions yet.</p></div>
          <button id="loadMoreQuestions" class="button small secondary load-more" hidden>Load more</button>
        </article>
        <article class="panel">
          <div class="panel-heading">
            <h2>Recent activity</h2>
            <div class="panel-actions">
              <button id="exportEvents" class="button small secondary">Export CSV</button>
              <button id="refreshEvents" class="button small secondary">Refresh</button>
            </div>
          </div>
          <div class="filter-row">
            <input id="searchEvents" type="text" placeholder="Search page, event type, visitor...">
          </div>
          <div id="eventList" class="record-list"><p class="muted">No activity yet.</p></div>
          <button id="loadMoreEvents" class="button small secondary load-more" hidden>Load more</button>
        </article>
        <article class="panel">
          <div class="panel-heading">
            <h2>Course enrolments</h2>
            <div class="panel-actions">
              <button id="toggleArchivedEnrollments" class="button small secondary" data-showing="false">Show archived</button>
              <button id="exportEnrollments" class="button small secondary">Export CSV</button>
              <button id="refreshEnrollments" class="button small secondary">Refresh</button>
            </div>
          </div>
          <div class="filter-row">
            <input id="searchEnrollments" type="text" placeholder="Search name, email, course...">
            <select id="filterStatusEnrollments">
              <option value="all">All statuses</option>
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="enrolled">Enrolled</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div id="enrollmentList" class="record-list"><p class="muted">No enrolments yet.</p></div>
          <button id="loadMoreEnrollments" class="button small secondary load-more" hidden>Load more</button>
        </article>
      </div>
    </section>
  </main>
  <script src="admin.js?v=7"></script>
</body>
</html>
